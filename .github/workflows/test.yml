name: Windows test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run setup.bat
        shell: cmd
        run: call setup.bat
      - name: Check packages
        run: .venv\Scripts\python main.py --check --offline
      - name: Unit tests
        run: .venv\Scripts\python -m unittest -v
      - name: Female voices (needs Microsoft's online service)
        continue-on-error: true
        env:
          PYTHONUTF8: "1"
        run: |
          .venv\Scripts\python -c "from agent import check, config; [check.synthesize(v, t) or print('OK', v) for v, t in ((config.VOICE_BN, 'আমি প্রস্তুত।'), (config.VOICE_EN, 'I am ready.'))]"
      - name: Desktop shortcut
        run: .venv\Scripts\python -c "from agent import shortcut; print(shortcut.install(startup=False))"
      - name: Wake word model knows the words (downloads ~40 MB)
        continue-on-error: true
        run: |
          .venv\Scripts\python -c "from agent import wake; wake.download(); import vosk, json; vosk.SetLogLevel(0); r = vosk.KaldiRecognizer(vosk.Model(str(wake.MODEL_DIR)), 16000, json.dumps(wake.GRAMMAR)); print('grammar loaded')"
      - name: Apps from the Start menu and sympy math
        env:
          PYTHONUTF8: "1"
        run: |
          .venv\Scripts\python -c "from agent import apps, tools; found = apps.installed(); print(len(found), 'apps'); assert found; print(apps.find('edge'), apps.find('notepad')); print(apps.open_app('powershell')); print(tools.math_solve('solve', 'x^2-5x+6=0')); print(tools.math_solve('integrate', 'x^2', lower='0', upper='3'))"
      - name: Phase 3-5 on Windows (tray, PDF, clipboard)
        env:
          PYTHONUTF8: "1"
        run: |
          .venv\Scripts\python -c "import pystray, pypdf, googleapiclient, google_auth_oauthlib; from agent import shortcut; print('icon', shortcut.icon_image().size)"
          .venv\Scripts\python -c "from agent import files; files.copy_to_clipboard('আমি ভাত খাই'); print('clipboard', files.read_clipboard())"
      - name: Web info (outside websites, may be slow)
        continue-on-error: true
        env:
          PYTHONUTF8: "1"
        run: |
          .venv\Scripts\python -c "from agent import info; print(info.weather()); print(info.news(count=3)); print(info.wikipedia('Dhaka', 'en')[:200])"
      - name: Offline English speech and "Hey Mira" (Windows voice, Vosk)
        continue-on-error: true
        env:
          PYTHONUTF8: "1"
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Speech
          $fmt = New-Object System.Speech.AudioFormat.SpeechAudioFormatInfo(16000, [System.Speech.AudioFormat.AudioBitsPerSample]::Sixteen, [System.Speech.AudioFormat.AudioChannel]::Mono)
          foreach ($pair in @(@("wake.wav", "hey mira"), @("talk.wav", "open the notepad app"))) {
            $s = New-Object System.Speech.Synthesis.SpeechSynthesizer
            $s.SetOutputToWaveFile($pair[0], $fmt); $s.Speak($pair[1]); $s.Dispose()
          }
          .venv\Scripts\python -c "import json, wave, vosk; from agent import wake; pcm = lambda f: wave.open(f).readframes(10**7); print('offline:', wake.offline_transcribe(pcm('talk.wav'))); r = vosk.KaldiRecognizer(wake.model(), 16000, json.dumps(wake.GRAMMAR)); r.SetWords(True); r.AcceptWaveform(pcm('wake.wav')); res = json.loads(r.FinalResult()); print('wake:', res.get('text'), wake.is_wake(res))"
      - name: Windows desktop tools (windows list, screenshot, Recycle Bin)
        continue-on-error: true
        env:
          PYTHONUTF8: "1"
        run: |
          .venv\Scripts\python -c "from agent import screen, control; print(screen.list_windows()); print('screen', screen.grab().size); print(control.system_status())"
          .venv\Scripts\python -c "from pathlib import Path; from agent import control; f = Path.home() / 'Documents' / 'mira-test.txt'; f.parent.mkdir(exist_ok=True); f.write_text('x'); control.to_recycle_bin(f); print('recycle bin ok', not f.exists())"
      - name: Replace an old running Mira
        env:
          PYTHONUTF8: "1"
          WAKE_WORD: "off"
          TRAY: "off"
        run: |
          Start-Process -FilePath .venv\Scripts\python.exe -ArgumentList "main.py","--background" -WindowStyle Hidden
          Start-Sleep -Seconds 8
          .venv\Scripts\python -c "from agent import web; print('before', web.running('http://127.0.0.1:8765/')); print('stopped', web.stop_old(8765)); print('after', web.running('http://127.0.0.1:8765/'))"
